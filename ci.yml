name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Lint, unit tests, links, secrets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Unit tests with coverage
        run: python -m pytest --cov=shared --cov-report=term-missing
      - name: Markdown links
        run: python scripts/check_links.py
      - name: Secret scan
        run: python scripts/check_secrets.py

  compose-config:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root compose file
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
        run: |
          set -e
          while IFS= read -r f; do
            echo "Validating $f"
            docker compose -f "$f" config --quiet
          done < <(find . -name 'docker-compose.yml' -not -path './.git/*')

  project-tests:
    name: Project test suites
    runs-on: ubuntu-latest
    needs: repository-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./scripts/run_project_tests.sh
