# Tooling configuration shared by every project in the repository.
# Individual projects pin their own runtime dependencies in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/_delta_log", "spark-warehouse"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["shared"]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]
