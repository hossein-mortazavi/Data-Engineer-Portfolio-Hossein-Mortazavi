# Shared development services. Each project ships its own docker-compose.yml and stays
# runnable on its own; this file only provides a convenience PostgreSQL for ad-hoc work.
name: de-portfolio

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portfolio} -d ${POSTGRES_DB:-portfolio}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
